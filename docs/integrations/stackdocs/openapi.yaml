openapi: 3.1.0
info:
  title: Orbit StackDocs Intake API
  version: 1.0.0
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
  description: >-
    Contrato de recepção durável de eventos do StackDocs. Uma resposta 202 confirma
    apenas o recibo; nenhum efeito operacional no CRM é prometido por esta API.
servers:
  - url: https://{projectHost}/functions/v1
    variables:
      projectHost:
        default: project-host.invalid
        description: Host publicado do projeto Orbit no Lovable Cloud.
paths:
  /orbit-stackdocs-intake/v1/events:
    post:
      operationId: acceptStackDocsEventV1
      summary: Recebe um evento StackDocs de forma idempotente.
      security:
        - StackDocsHmac: []
      parameters:
        - name: X-StackDocs-Connection
          in: header
          required: true
          schema:
            type: string
            minLength: 8
            maxLength: 128
        - name: X-StackDocs-Timestamp
          in: header
          required: true
          description: Unix timestamp em segundos incluído na assinatura.
          schema:
            type: integer
            minimum: 1
        - name: X-StackDocs-Signature
          in: header
          required: true
          description: Assinatura no formato v1=<hex HMAC-SHA256>.
          schema:
            type: string
            pattern: '^v1=[a-f0-9]{64}$'
        - name: Idempotency-Key
          in: header
          required: true
          description: Deve ser idêntica a event_id.
          schema:
            type: string
            minLength: 8
            maxLength: 128
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ./schemas/stackdocs-submission-completed-v1.schema.json
      responses:
        '202':
          description: Evento persistido ou duplicata idêntica reconhecida.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AcceptedResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
components:
  securitySchemes:
    StackDocsHmac:
      type: apiKey
      in: header
      name: X-StackDocs-Signature
      description: >-
        HMAC-SHA256 por conexão sobre `<timestamp>.<raw-body>`. Os headers de
        conexão e timestamp também são obrigatórios.
  schemas:
    AcceptedResponse:
      type: object
      additionalProperties: false
      required: [ok, status, receipt_id, duplicate, correlation_id]
      properties:
        ok:
          const: true
        status:
          const: accepted
        receipt_id:
          type: string
          format: uuid
        duplicate:
          type: boolean
        correlation_id:
          type: string
          minLength: 8
          maxLength: 128
    ErrorResponse:
      type: object
      additionalProperties: false
      required: [ok, error, correlation_id]
      properties:
        ok:
          const: false
        error:
          type: object
          additionalProperties: false
          required: [code, message, retryable]
          properties:
            code:
              type: string
            message:
              type: string
            retryable:
              type: boolean
        correlation_id:
          type: string
  responses:
    BadRequest:
      description: Envelope, headers ou versão inválidos.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    Unauthorized:
      description: Assinatura ausente, inválida ou fora da janela temporal.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    Forbidden:
      description: Conexão, entitlement ou feature flag não autorizados.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    Conflict:
      description: event_id já recebido com conteúdo divergente.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    PayloadTooLarge:
      description: Corpo ou anexo fora dos limites do contrato.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    RateLimited:
      description: Limite da conexão excedido.
      headers:
        Retry-After:
          schema: { type: integer, minimum: 1 }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    InternalError:
      description: Recibo durável não confirmado; a origem pode repetir.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
